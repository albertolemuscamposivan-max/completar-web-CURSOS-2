<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones - Plataforma Educativa</title>
    <link rel="stylesheet" href="css/miestilo.css">
</head>
<body>

    <!-- Encabezado -->
    <header>
        <div class="logo">
            <h1>Plataforma Cursos</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="mentoria.html">Mentoría</a></li>
                <li><a href="inscripciones.html">Inscripciones</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="contenedor-inscripciones">
        <h2>Formulario de Inscripción</h2>
        
        <form action="#" method="GET" class="formulario-registro">
            <div class="campo">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="campo">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="1234567890" required>
            </div>

            <div class="campo">
                <label for="curso">Selecciona el Curso:</label>
                <select id="curso" name="curso" required>
                    <option value="">-- Seleccionar un curso --</option>
                    <option value="frontend">Desarrollo Web Frontend Completo</option>
                    <option value="javascript">JavaScript Moderno para Principiantes</option>
                    <option value="python">Programación en Python y Ciencia de Datos</option>
                </select>
            </div>

            <div class="campo">
                <label for="tipo_pago">Modalidad de Pago:</label>
                <select id="tipo_pago" name="tipo_pago" required>
                    <option value="">-- Seleccionar opción --</option>
                    <option value="unico">Pago Único</option>
                    <option value="mensual">Suscripción Mensual</option>
                </select>
            </div>

            <button type="submit">Completar Inscripción</button>
        </form>
    </main>

    <!-- Pie de Página -->
    <footer>
        <p>&copy; 2026 Plataforma Cursos - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
